apply plugin: 'com.android.library'

android {

    namespace 'ru.noties.jlatexmath.android'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        minSdk 21
    }

    sourceSets {
        // disable original tests as they rely on image creation
        test.java.srcDirs = []
    }

    lintOptions {
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    api 'androidx.annotation:annotation:1.7.0'
}
